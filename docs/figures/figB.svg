<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="IBM Plex Sans, system-ui, sans-serif">
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#5a6b6a"/></marker>
<marker id="bw" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto"><path d="M0,0 L6.5,3 L0,6 Z" fill="#a5701f"/></marker></defs>
<rect x="0" y="0" width="560" height="500" fill="#ffffff"/>
<text x="20" y="28" font-size="15" font-weight="700" fill="#15201f">図B　演算処理部の反復ループ（採否制御：方式C）</text>
<g font-size="11" text-anchor="middle">
  <rect x="180" y="48"  width="200" height="34" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="280" y="70" fill="#15201f">待ち（CAPTURE_READY / 割込）</text>
  <rect x="180" y="96"  width="200" height="34" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="280" y="118" fill="#15201f">観測I/Q 読込（DDR / Ethernet）</text>
  <rect x="180" y="144" width="200" height="34" rx="7" fill="#0e7c8618" stroke="#0e7c86"/><text x="280" y="166" fill="#0b5b63">係数推定  θ = Φ \ y</text>
  <rect x="180" y="192" width="200" height="34" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="280" y="214" fill="#15201f">タグ付け（obs/req/coef_id）</text>
  <rect x="150" y="240" width="260" height="38" rx="9" fill="#ffffff" stroke="#0e7c86" stroke-width="1.6"/><text x="280" y="264" fill="#0b5b63" font-weight="600">採否判定</text>
</g>
<g stroke="#5a6b6a" stroke-width="1.4" fill="none" marker-end="url(#b)">
  <line x1="280" y1="82" x2="280" y2="94"/><line x1="280" y1="130" x2="280" y2="142"/>
  <line x1="280" y1="178" x2="280" y2="190"/><line x1="280" y1="226" x2="280" y2="238"/>
</g>
<!-- 4分岐 -->
<g font-size="10.5" text-anchor="middle">
  <rect x="30"  y="312" width="110" height="60" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="85" y="333" fill="#2e7d5b" font-weight="600">採用</text><text x="85" y="350" font-size="9" fill="#586867">待機バンク書込</text><text x="85" y="363" font-size="9" fill="#586867">→境界同期切替</text>
  <rect x="155" y="312" width="105" height="60" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="207" y="333" fill="#a5701f" font-weight="600">保留</text><text x="207" y="352" font-size="9" fill="#586867">現係数維持</text>
  <rect x="275" y="312" width="105" height="60" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="327" y="333" fill="#b03a3a" font-weight="600">破棄</text><text x="327" y="352" font-size="9" fill="#586867">原因記録</text>
  <rect x="395" y="312" width="130" height="60" rx="7" fill="#eef2f2" stroke="#c2cbca"/><text x="460" y="333" fill="#0b5b63" font-weight="600">再計算</text><text x="460" y="352" font-size="9" fill="#586867">有効観測で再要求</text>
</g>
<g stroke="#5a6b6a" stroke-width="1.3" fill="none" marker-end="url(#b)">
  <path d="M220,278 L85,310"/><path d="M262,278 L207,310"/><path d="M298,278 L327,310"/><path d="M340,278 L460,310"/>
</g>
<!-- VERIFY/戻り -->
<rect x="30" y="398" width="110" height="34" rx="7" fill="#ffffff" stroke="#c2cbca"/><text x="85" y="420" text-anchor="middle" font-size="10.5" fill="#15201f">更新後 評価</text>
<line x1="85" y1="372" x2="85" y2="396" stroke="#5a6b6a" stroke-width="1.3" marker-end="url(#b)"/>
<path d="M85,432 L85,448 L460,448 L460,372" fill="none" stroke="#a5701f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#bw)"/>
<text x="275" y="443" text-anchor="middle" font-size="9.5" fill="#a5701f">悪化なら ROLLBACK / いずれも待ちへ戻る</text>
<!-- loop back to top -->
<path d="M207,372 L207,388 L505,388 L505,65 L382,65" fill="none" stroke="#5a6b6a" stroke-width="1.2" marker-end="url(#b)"/>
<text x="515" y="230" font-size="9.5" fill="#586867" transform="rotate(90 515 230)">次の観測へ</text>
</svg>
